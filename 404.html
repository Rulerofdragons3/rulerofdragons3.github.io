<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <link rel = "stylesheet" href="/css/main.css">
    <link rel="icon" type="img/png" href="/favicon-32x32.png">
    <style>
        div#align {
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        div#main {
            background-color: var(--page-color);
            width: fit-content;
            height: fit-content;
            border-radius: 10px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="theme-selector"></div>
    <div class="siteContainer">
    <div id="align">
        <div id="main">
            <img src="https://media.tenor.com/i2oPdqsIhpsAAAAi/bubu-dudu-sseeyall.gif" class="borderless center" height="450px"></img>
            <h1 class="center" style="font-size: 500%; margin: 0;">404</h1>
            <p id="message" class="center"></p>
            <a href="/"><p class="center">Home</p></a>
        </div>

    </div>
    <script>
        const messages = [
            "How did you get here?",
            "Why are you here?",
            "Try a page that exists?",
            "I'm assuming you just wanted to see what the 404 page looks like.",
            "'can't seem to find that page.",
            "Go home lil bro",
            "This is my 404 page. You like it?",
            "I think you took a wrong turn.",
            "I wonder if anyone will ever read this."
        ];
        const msg = document.getElementById("message");
        msg.textContent = messages[Math.floor((Math.random() * messages.length))]
    </script>
    <script src="/js/main.js"></script>
    </div>
</body>
